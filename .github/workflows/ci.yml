name: CI

# Workflow opcional (Apêndice A do regulamento: ".github/workflows/ (quando utilizado)").
# Ele instala as dependências e roda os testes automatizados a cada push/PR na main.
# Adapte ou remova conforme a tecnologia real escolhida pelo grupo.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./src
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: src/package-lock.json

      - name: Instalar dependências
        run: npm install

      - name: Rodar testes
        run: npm test --if-present
