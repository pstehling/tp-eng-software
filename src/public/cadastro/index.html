<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cadastro</title>
    <!-- 1. Importe o Supabase direto da internet AQUI -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    
    <form id="form-cadastro">
        <h2>Criar Conta</h2>
        <div id="mensagem" style="display: none;"></div>
        
        <input type="text" id="nome" placeholder="Nome completo" required>
        <input type="email" id="email" placeholder="E-mail" required>
        <input type="password" id="senha" placeholder="Senha" required minlength="6">
        <input type="password" id="confirma-senha" placeholder="Confirmar Senha" required minlength="6">
        
        <button type="submit" id="btn-cadastrar">Cadastrar</button>
    </form>

    <!-- 2. Importe o seu script normal (sem type="module") -->
    <script src="./script.js"></script>
</body>
</html>
