<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cadastro</title>
</head>
<body>
    
    <form id="form-cadastro">
        <h2>Criar Conta</h2>
        <div id="mensagem" style="display: none;"></div>
        
        <input type="text" id="nome" placeholder="Nome completo" required>
        <input type="email" id="email" placeholder="E-mail institucional (@ufla.br ou @estudante.ufla.br)" required>
        <input type="password" id="senha" placeholder="Senha (mín. 8 caracteres, com letra e número)" required minlength="8">
        <input type="password" id="confirma-senha" placeholder="Confirmar Senha" required minlength="8">
        
        <button type="submit" id="btn-cadastrar">Cadastrar</button>
        <p>Já tem conta? <a href="/login/index.html">Entrar</a></p>
    </form>

    <script src="./script.js"></script>
</body>
</html>
