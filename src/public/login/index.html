<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Login da Plataforma</title>
</head>
<body>
    
    <form id="form-login">
        <h2>Acesse sua conta</h2>
        <div id="mensagem-erro" style="color: red; display: none;"></div>
        
        <!-- O type="email" e required barram formatos inválidos automaticamente -->
        <input type="email" id="email" placeholder="E-mail" required>
        <input type="password" id="senha" placeholder="Senha" required>
        
        <button type="submit" id="btn-entrar">Entrar</button>
        
        <div style="margin-top: 15px;">
            <a href="/recuperar-senha.html">Esqueci minha senha</a><br><br>
            <span>Não tem conta? </span><a href="/cadastro">Cadastre-se</a>
        </div>
    </form>

    <script src="./script.js"></script>
</body>
</html>
